<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Privora | Login</title>
  
  <!-- Early Theme Init Script -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('privora-theme') || 
        (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-bs-theme', savedTheme);
    })();
  </script>

  <!-- Strictly Local Assets -->
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
  <link href="../assets/css/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/css/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body class="min-vh-100 d-flex flex-column justify-content-between">

  <!-- Top Navigation Bar -->
  <nav class="navbar px-3 px-md-4">
    <div class="container-fluid d-flex justify-content-between align-items-center">
      <a href="../index.html" class="navbar-brand d-flex align-items-center gap-2 text-decoration-none">
        <i class="bi bi-qr-code-scan"></i>
        <span>Privora</span>
      </a>

      <div class="d-flex align-items-center gap-2">
        <a href="../index.html" class="btn btn-sm btn-outline-secondary d-none d-sm-inline-flex align-items-center">
          <i class="bi bi-arrow-left me-1"></i> Home
        </a>
        <button class="theme-toggle-btn" id="themeToggle" type="button" aria-label="Toggle color theme" title="Toggle color mode">
          <i class="bi bi-moon-stars-fill"></i>
        </button>
      </div>
    </div>
  </nav>

  <!-- Centered Login Card -->
  <main class="container my-auto py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4" style="max-width: 440px;">
        
        <div class="card p-4 shadow-sm">
          <div class="mb-4 text-center">
            <div class="feature-icon mx-auto mb-2">
              <i class="bi bi-box-arrow-in-right"></i>
            </div>
            <h4 class="fw-bold mb-1">Account Sign In</h4>
            <p class="text-slate small mb-0">Enter your credentials and select your role.</p>
          </div>

          <form action="dashboard.html">
            <!-- Role selection dropdown -->
            <div class="mb-3">
              <label for="role" class="form-label small fw-medium">Select Role</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
                <select class="form-select" id="role" name="role" required>
                  <option value="" disabled selected>Choose your role...</option>
                  <option value="student">Student</option>
                  <option value="teacher">Teacher / Faculty</option>
                  <option value="admin">System Administrator</option>
                </select>
              </div>
            </div>

            <!-- Email -->
            <div class="mb-3">
              <label for="email" class="form-label small fw-medium">Institutional Email</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="email" placeholder="name@university.edu" required>
              </div>
            </div>

            <!-- Password -->
            <div class="mb-3">
              <div class="d-flex justify-content-between align-items-center">
                <label for="password" class="form-label small fw-medium mb-0">Password</label>
                <a href="#" class="small text-decoration-none text-slate">Forgot password?</a>
              </div>
              <div class="input-group mt-1">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="password" placeholder="Enter password" required>
              </div>
            </div>

            <!-- Remember Me -->
            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" id="remember" checked>
              <label class="form-check-label text-slate small" for="remember">
                Keep me signed in on this device
              </label>
            </div>

            <!-- Submit -->
            <a href="dashboard.html" class="btn btn-primary w-100 py-2 mb-3">
              Sign In to Console <i class="bi bi-arrow-right ms-1"></i>
            </a>

            <div class="text-center">
              <span class="text-slate small">Don't have an account?</span>
              <a href="signup.html" class="small fw-semibold text-decoration-none ms-1 text-brand">Register access</a>
            </div>
          </form>
        </div>

      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="p-3 text-center text-slate small">
    <div class="container">
      <span>&copy; 2026 Privora Technologies. Strictly Offline Roll Call Platform.</span>
    </div>
  </footer>

  <!-- Local Bundle JS -->
  <script src="../assets/js/bootstrap.bundle.min.js"></script>

  <!-- Offline Theme Switcher Script -->
  <script>
    (function() {
      const toggleBtn = document.getElementById('themeToggle');
      if (!toggleBtn) return;

      function updateIcon(theme) {
        if (theme === 'dark') {
          toggleBtn.innerHTML = '<i class="bi bi-sun-fill text-warning"></i>';
          toggleBtn.setAttribute('title', 'Switch to light theme');
        } else {
          toggleBtn.innerHTML = '<i class="bi bi-moon-stars-fill"></i>';
          toggleBtn.setAttribute('title', 'Switch to dark theme');
        }
      }

      const activeTheme = document.documentElement.getAttribute('data-bs-theme') || 'light';
      updateIcon(activeTheme);

      toggleBtn.addEventListener('click', function() {
        const current = document.documentElement.getAttribute('data-bs-theme');
        const nextTheme = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-bs-theme', nextTheme);
        localStorage.setItem('privora-theme', nextTheme);
        updateIcon(nextTheme);
      });
    })();
  </script>
</body>
</html>
